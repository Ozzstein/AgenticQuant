[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiquant"
version = "0.1.0"
description = "AI-powered quantitative trading platform with LangGraph multi-agent system"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.3.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer[all]>=0.12.0",
    "rich>=13.0",
    "loguru>=0.7.0",
    "tenacity>=8.0",
    "yfinance>=0.2.30",
    "ccxt>=4.0",
    "finnhub-python>=2.4",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "cvxpy>=1.4",
    "riskfolio-lib>=6.0",
    "plotly>=5.18",
    "pandas>=2.1",
    "numpy>=1.24,<2.0",
    "httpx>=0.25",
    "python-telegram-bot>=20.0",
    "apscheduler>=3.10",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.11",
    "ruff>=0.5.0",
    "mypy>=1.5",
    "jupyterlab>=4.0",
]
qlib = [
    "pyqlib>=0.9",
]
full = [
    "httpx>=0.25",
    "newspaper3k>=0.2; python_version<'3.12'",
    "sec-edgar-downloader>=5.0",
    "streamlit>=1.28",
    "python-telegram-bot>=20.0",
    "finrl>=0.3; python_version>='3.10'",
    # Heavy / unstable extras — install manually if needed:
    # torch>=2.0
    # quantconnect-stubs
    # rdagent (install separately, git)
    # transformers>=4.40 (install separately, large)
    # peft>=0.10 (install separately, large)
]

[project.scripts]
aiquant = "src.utils.cli:app"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external APIs or data (deselect with '-m \"not integration\"')",
]
addopts = "-v --tb=short"

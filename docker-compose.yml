x-runtime: &runtime
  image: quantagentlab:local
  build:
    context: .
  env_file:
    - path: config/.env
      required: false
  environment:
    AIQUANT_OUTPUT_DIR: /app/outputs
    AIQUANT_LOG_DIR: /app/logs
    AIQUANT_PAPER_LEDGER_PATH: /app/outputs/paper-ledger.sqlite3
    AIQUANT_PAPER_ACCOUNT_ID: ${AIQUANT_PAPER_ACCOUNT_ID:-paper:default}
    AIQUANT_PAPER_BASE_CURRENCY: ${AIQUANT_PAPER_BASE_CURRENCY:-USD}
  volumes:
    - data:/app/data
    - outputs:/app/outputs
    - logs:/app/logs

services:
  scheduler:
    <<: *runtime
    restart: unless-stopped
    command: ["python", "-m", "src.scheduler", "--loop"]

  app:
    <<: *runtime
    profiles: ["manual"]
    command: ["python", "scripts/run_pipeline.py", "run", "--mode", "paper"]

  dashboard:
    <<: *runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    command: ["streamlit", "run", "src/dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]

volumes:
  data:
  outputs:
  logs:

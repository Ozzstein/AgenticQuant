log_level: INFO

qlib:
  region: us
  dataset: Alpha158
  train_start: "2010-01-01"
  train_end: "2022-12-31"
  test_start: "2023-01-01"
  test_end: "2024-12-31"

agents:
  llm_provider: anthropic
  llm_model: claude-sonnet-4-20250514
  temperature: 0.2
  max_debate_rounds: 2

crypto:
  exchange: binance
  top_n_universe: 20
  quote_currency: USDT

models:
  default_model: LightGBM
  topk: 30
  walk_forward_months: 3
  embargo_days: 5
  transaction_cost_bps: 10.0
  ensemble_models: ["LightGBM", "XGBoost", "Linear"]
  ensemble_method: ic_weighted
  ensemble_val_fraction: 0.15

risk:
  max_position_weight: 10.0
  max_drawdown_halt: 15.0
  max_daily_turnover: 25.0

monitoring:
  schedule_time: "16:00"
  schedule_timezone: US/Eastern

strategy:
  selection_method: regime_based
  default_strategy: momentum_topk

rd_agent:
  min_backtest_sharpe: 0.5

alpaca:
  enabled: false
  paper: true

ccxt:
  enabled: false
  paper: true
  exchange: binance
  quote_currency: USDT
  max_retries: 5  # non-default (class default is 3) — verified in test_ccxt_config_yaml_section

memory:
  enabled: true
  max_history: 10

[project]
name = "quantagentlab-native-rd-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "rdagent",
    "pyqlib==0.9.7",
    "numpy>=1.26,<2",
    "pandas>=2.1,<3",
    "pyarrow==19.0.1",
    "torch==2.14.1",
    "tables>=3.10,<4",
]

[tool.uv]
package = false

[tool.uv.sources]
rdagent = { git = "https://github.com/microsoft/RD-Agent.git", rev = "484776c211e4fbbeef03e0ec00d6bbee7362a4f4" }

torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
